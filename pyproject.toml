[project]
name = "tg-account-bot"
version = "0.1.0"
description = "Telegram multi-account management bot for authorized test accounts."
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.6,<4",
  "aiohttp>=3.9,<4",
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=50,<51",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.11,<3",
  "qrcode[pil]>=8,<9",
  "SQLAlchemy>=2.0,<3",
  "Telethon>=1.36,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.ruff]
line-length = 100
